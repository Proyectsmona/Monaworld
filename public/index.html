<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MonaWorld v6</title><style>
:root{--bg:#07040d;--p:#ff35b8;--v:#9b5cff;--t:#f7efff;--m:#aa9bb7;--l:#2c1b3c}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#2b1040,#08050d 40%,#050308);color:var(--t);font:14px system-ui,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.cover{min-height:100vh;display:grid;place-items:center;padding:30px}.hero{width:min(1100px,100%);display:grid;grid-template-columns:1.3fr .7fr;gap:30px}.brand{font-size:64px;font-weight:900}.brand b{color:var(--p);text-shadow:0 0 32px #ff35b877}.lead{font-size:18px;line-height:1.6;color:#ddcfe7}.features{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:24px}.feature,.card{background:#ffffff08;border:1px solid var(--l);border-radius:15px}.feature{padding:13px}.login{background:#0f0818;border:1px solid #743cb0;border-radius:22px;padding:26px;box-shadow:0 0 60px #8e36c52b}.field{display:grid;gap:6px;margin:12px 0}.field input,.field select,.field textarea{width:100%;background:#08050d;border:1px solid var(--l);color:white;border-radius:9px;padding:11px}.primary{border:0;color:white;background:linear-gradient(90deg,var(--p),var(--v));padding:12px;border-radius:10px;font-weight:800}.login .primary{width:100%}.muted{color:var(--m);font-size:12px}.shell{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.side{background:#08060c;border-right:1px solid var(--l);padding:18px;position:sticky;top:0;height:100vh}.logo{font-size:24px;font-weight:900;margin:5px 10px 24px}.logo b{color:var(--p)}.nav{display:grid;gap:4px}.nav button{background:transparent;border:0;color:#cfc2d8;text-align:left;padding:10px;border-radius:9px}.nav button:hover,.nav button.active{background:#ff35b817;color:#fff;border-left:2px solid var(--p)}.userbox{position:absolute;left:18px;right:18px;bottom:18px;border:1px solid var(--l);border-radius:12px;padding:10px}.main{padding:25px;max-width:1500px;width:100%}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.top h1{margin:0}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{grid-column:span 4;padding:18px;background:linear-gradient(145deg,#130b1b,#0a0710)}.wide{grid-column:span 8}.full{grid-column:1/-1}.stat{font-size:31px;font-weight:900;margin:8px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #20152b;padding:11px 0}.badge{font-size:10px;border:1px solid var(--l);padding:4px 8px;border-radius:99px}.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tab,.actions button{background:#0c0811;color:#ddd;border:1px solid var(--l);padding:9px 12px;border-radius:9px}.tab.active{border-color:#ff35b877;background:#ff35b81b}.preview{min-height:300px;border:1px dashed #a35cff66;border-radius:15px;display:grid;place-items:center}.alert{padding:28px;text-align:center;border:1px solid #ff35b866;border-radius:18px;background:#08050ddd}.alert strong{font-size:30px;color:var(--p)}.event{background:#0a0710;border:1px solid var(--l);border-radius:11px;padding:11px;margin:8px 0}.toast{position:fixed;right:20px;bottom:20px;padding:12px 15px;border:1px solid var(--p);border-radius:10px;background:#160b20;z-index:10}@media(max-width:850px){.hero{grid-template-columns:1fr}.shell{grid-template-columns:1fr}.side{height:auto;position:relative}.userbox{position:static;margin-top:18px}.card,.wide{grid-column:1/-1}.brand{font-size:46px}}
</style></head><body><div id="root"></div><script>
const demo={lamonachinajuega:{p:"Monatest1234",r:"ADMIN"},moderadormona:{p:"modtest1234",r:"MODERATOR_ADMIN"}},S={u:null,page:"overview",platform:"Twitch",coins:0,points:0,timer:0,events:[],coin:"MonaCoins",pointsName:"MonaPoints"};
const nav=[["overview","Dashboard","◈"],["overlay","Overlay Studio","▣"],["alerts","Alertas","⚡"],["events","Eventos & Acciones","↯"],["commands","Comandos","⌘"],["music","Music / Media","♫"],["chat","Multi Chat","☷"],["economy","Economy","◎"],["platforms","Plataformas","◉"],["obs","OBS / Browser Sources","▤"],["store","Store / Premium","◇"],["settings","Configuración","⚙"]];
function toast(x){let d=document.createElement("div");d.className="toast";d.textContent=x;document.body.append(d);setTimeout(()=>d.remove(),2200)}
function cover(){root.innerHTML=`<div class=cover><div class=hero><section><div class=brand>Mona<b>World</b></div><p class=lead>Centro unificado para VTubers y streamers: eventos, alertas, overlays, economía, música y multi-chat mediante integraciones oficiales.</p><div class=features>${["Twitch","YouTube","Kick","TikTok LIVE","Alertas editables","MonaCoins","MonaPoints","MonaTimer","Multi Chat","Media Request","Browser Sources","Simulador"].map(x=>`<div class=feature>✦ ${x}</div>`).join("")}</div></section><section class=login><h2>Iniciar sesión</h2><div class=field><label>Usuario</label><input id=u></div><div class=field><label>Contraseña</label><input id=p type=password></div><button class=primary onclick=login()>ENTRAR</button><p class=muted>Prototipo. Las cuentas se migrarán a D1 + hash + sesiones seguras.</p></section></div></div>`}
function login(){let u=document.getElementById("u").value,p=document.getElementById("p").value;if(demo[u]?.p===p){S.u={name:u,role:demo[u].r};render()}else toast("Credenciales incorrectas")}
function logout(){S.u=null;cover()}function go(x){S.page=x;render()}
function shell(){root.innerHTML=`<div class=shell><aside class=side><div class=logo>Mona<b>World</b></div><div class=nav>${nav.map(x=>`<button class="${S.page===x[0]?"active":""}" onclick="go('${x[0]}')">${x[2]} ${x[1]}</button>`).join("")}</div><div class=userbox>👤 ${S.u.name}<br><span class=muted>${S.u.role}</span><br><button onclick=logout() style="margin-top:8px;background:none;border:0;color:#ff75c9">Cerrar sesión</button></div></aside><main class=main>${page()}</main></div>`}
function head(a,b){return `<div class=top><div><h1>${a}</h1><span class=muted>${b}</span></div><span class=badge>● ${S.u.role}</span></div>`}
function page(){
if(S.page==="overview")return head("Dashboard","Estado general")+`<div class=grid><div class=card><span class=muted>${S.coin}</span><div class=stat>${S.coins}</div></div><div class=card><span class=muted>${S.pointsName}</span><div class=stat>${S.points}</div></div><div class=card><span class=muted>MonaTimer</span><div class=stat>${S.timer}s</div></div><div class="card wide"><h3>Plataformas</h3>${["Twitch","YouTube","Kick","TikTok LIVE"].map(p=>`<div class=row><span>${p}</span><span class=badge>OAUTH/API PREPARADO</span></div>`).join("")}</div><div class=card><h3>Eventos</h3>${S.events.slice(-5).reverse().map(e=>`<div class=event><b>${e.platform}</b> · ${e.type}<br>${e.user} +${e.coins} ${S.coin}</div>`).join("")||"<span class=muted>Sin eventos.</span>"}</div></div>`;
if(S.page==="overlay")return head("Overlay Studio","Pantalla completa + fuentes independientes")+`<div class=tabs><button class="tab active">Full Screen</button><button class=tab>Alertas</button><button class=tab>Chat</button><button class=tab>Timer</button><button class=tab>Media</button></div><div class=grid><div class="card wide"><h3>Preview 1920×1080</h3><div class=preview><div class=alert><strong>MONAWORLD</strong><br>Browser Source transparente</div></div></div><div class=card><h3>Transformación</h3>${["X","Y","Escala","Opacidad"].map(x=>`<div class=field><label>${x}</label><input value="50"></div>`).join("")}<label><input type=checkbox checked> Animaciones</label></div></div>`;
if(S.page==="alerts")return head("Alertas","Editor y pruebas por plataforma")+`<div class=tabs>${["Twitch","YouTube","Kick","TikTok LIVE"].map(p=>`<button class="tab ${S.platform===p?"active":""}" onclick="S.platform='${p}';render()">${p}</button>`).join("")}</div><div class=grid><div class="card wide"><h3>Editor · ${S.platform}</h3><div class=field><label>Texto</label><input value="{user} realizó {event} · +{amount} ${S.coin}"></div><div class=field><label>Fuente</label><select><option>Inter</option><option>Montserrat</option><option>Orbitron</option></select></div><div class=field><label>Imagen/GIF URL</label><input></div><div class=field><label>Sonido</label><input type=file accept="audio/*"></div><div class=actions><button onclick=test()>▶ Probar evento</button><button onclick="toast('Guardado en prototipo')">Guardar</button></div></div><div class=card><h3>Tipos</h3>${["Follow","Subscription","Donation","Bits / Cheers","Gift","Super Chat","Membership","Raid","Like","Share","Chat"].map(x=>`<div class=row>${x}<span class=badge>editable</span></div>`).join("")}</div></div>`;
if(S.page==="events")return head("Eventos & Acciones","Evento → economía → Overlay")+`<div class=actions><button onclick=test()>＋ Donación</button><button onclick="sim('Subscription')">＋ Suscripción</button><button onclick="sim('Follow')">＋ Follow</button><button onclick="sim('Gift')">＋ Gift</button></div><div class=card full>${S.events.slice().reverse().map(e=>`<div class=event><b>${e.platform}</b> · ${e.type} <span class=badge>SIMULATED</span><br>${e.user} · ${e.amount}<br><span class=muted>+${e.coins} ${S.coin} · +${e.points} ${S.pointsName} · +${e.timer}s</span></div>`).join("")||"Sin eventos."}</div>`;
if(S.page==="commands")return head("Comandos","Acciones configurables")+`<div class=grid><div class="card wide">${["!song","!request","!clip","!timer","!coins","!points","!alert","!uptime"].map(x=>`<div class=row><b>${x}</b><span class=badge>configurable</span></div>`).join("")}</div><div class=card><h3>Nuevo comando</h3><div class=field><input placeholder="!mona"></div><textarea placeholder="Respuesta"></textarea><br><br><button class=primary onclick="toast('Comando creado')">Guardar</button></div></div>`;
if(S.page==="music")return head("Music / Media","Media Request y sonidos")+`<div class=grid><div class="card wide"><h3>Media Request</h3><div class=field><input placeholder="URL de contenido permitido"></div><div class=actions><button onclick="toast('Añadido')">Añadir</button><button>Pausar</button><button>Vaciar</button></div><div class=event>🎵 Cola vacía</div></div><div class=card><h3>Sonidos</h3><input type=file accept="audio/*" multiple><p class=muted>Podrán vincularse a recompensas de MonaCoins.</p></div></div>`;
if(S.page==="chat")return head("Multi Chat","Twitch · YouTube · Kick · TikTok LIVE")+`<div class=grid><div class="card wide"><h3>Chat unificado</h3>${["Twitch","YouTube","Kick","TikTok LIVE"].map(p=>`<div class=event><b>${p}</b> · usuario_demo<br>Hola Mona 👋</div>`).join("")}<div class=field><input placeholder="Mensaje de moderador"></div><button class=primary onclick="toast('Mensaje simulado')">Enviar</button></div><div class=card><h3>Moderación</h3><div class=actions><button>Slow</button><button>Timeout</button><button>Ban</button></div></div></div>`;
if(S.page==="economy")return head("Economy","MonaCoins y MonaPoints separados")+`<div class=grid><div class=card><h3>${S.coin}</h3><p class=muted>Moneda interna, no representa créditos de terceros.</p><div class=stat>${S.coins}</div><button class=primary onclick=adminCoins()>+1000 prueba</button></div><div class=card><h3>${S.pointsName}</h3><p class=muted>Fidelidad por tiempo, actividad y juegos.</p><div class=stat>${S.points}</div><button class=primary onclick="S.points+=100;render()">+100</button></div><div class=card><h3>MonaTimer</h3><div class=stat>${S.timer}s</div><button class=primary onclick="S.timer+=60;render()">+60 segundos</button></div></div>`;
if(S.page==="platforms")return head("Plataformas","Conectores mediante mecanismos oficiales")+`<div class=grid>${["Twitch","YouTube","Kick","TikTok LIVE"].map(p=>`<div class=card><h3>${p}</h3><p class=muted>OAuth/API/webhook · credenciales no incluidas.</p><span class=badge>NO CONECTADO</span><br><br><button class=primary onclick="toast('${p}: OAuth pendiente')">Conectar</button></div>`).join("")}<div class="card full"><p class=muted>No se crean, venden ni alteran Bits, Coins, Gifts, subs u otros créditos de las plataformas. El simulador es interno.</p></div></div>`;
if(S.page==="obs")return head("OBS / Browser Sources","Fuentes independientes")+`<div class=card full><h3>URLs</h3>${["overlay","alerts","chat","timer","media"].map(x=>`<div class=row><code>${location.origin}/${x}.html</code><button onclick="navigator.clipboard?.writeText(location.origin+'/${x}.html');toast('URL copiada')">Copiar</button></div>`).join("")}</div>`;
if(S.page==="store")return head("Store / Premium","Donaciones y productos")+`<div class=grid><div class=card><h3>Donación</h3><p>PayPal: <b>lamonachinajuega@gmail.com</b></p><button class=primary onclick="toast('Checkout pendiente')">Donar</button></div><div class=card><h3>MonaWorld Premium</h3><button class=primary onclick="toast('Checkout pendiente')">Comprar</button></div><div class=card><h3>MonaProyect</h3><button class=primary onclick="toast('Producto pendiente')">Ver</button></div><div class=card><h3>MonaClips</h3><button class=primary onclick="toast('Producto pendiente')">Ver</button></div></div>`;
return head("Configuración","Economía y cuenta")+`<div class=grid><div class=card><h3>Economía</h3><div class=field><label>Nombre moneda</label><input value="${S.coin}" onchange="S.coin=this.value;render()"></div><div class=field><label>Nombre loyalty</label><input value="${S.pointsName}" onchange="S.pointsName=this.value;render()"></div></div><div class=card><h3>Cuenta</h3><p>${S.u.name}</p><p class=muted>${S.u.role}</p></div><div class="card full"><p class=muted>Producción: D1, hashes, sesiones HttpOnly/SameSite, OAuth, secretos, validación de firmas, rate limiting y auditoría.</p></div></div>`;
}
function sim(type){let e={platform:S.platform,type,user:"usuario_demo",amount:type==="Gift"?50:0,coins:type==="Follow"?0:50,points:25,timer:type==="Subscription"?120:10};S.events.push(e);S.coins+=e.coins;S.points+=e.points;S.timer+=e.timer;toast("Evento simulado");render()}
function test(){sim("Donation")}function adminCoins(){if(S.u.role!=="ADMIN")return toast("Solo ADMIN");S.coins+=1000;S.events.push({platform:"ADMIN",type:"MonaCoins TEST",user:S.u.name,amount:1000,coins:1000,points:0,timer:0});render()}function render(){S.u?shell():cover()}render();
</script></body></html>
