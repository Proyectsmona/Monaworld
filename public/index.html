ottom:15px}.tab{padding:8px 11px;border:1px solid var(--line);background:#0d0715;color:#c8bad6;border-radius:9px}.tab.on{background:linear-gradient(90deg,#ff35d126,#8b5cf626);color:#fff;border-color:#773d92}.btn{border:1px solid #4a2868;background:#1a0d2b;color:#fff;padding:9px 12px;border-radius:9px}.btn.primary{background:linear-gradient(90deg,#ff35d1,#8b5cf6);border:0;font-weight:800}.btn.good{border-color:#1c8b60}.btn.danger{border-color:#9c3150}.field{display:grid;gap:6px;margin:9px 0}.field label{color:#b9aac7;font-size:12px}.field input,.field select,.field textarea{width:100%;background:#09050e;color:#fff;border:1px solid #352047;border-radius:9px;padding:10px;outline:none}.field input:focus,.field textarea:focus{border-color:var(--pink);box-shadow:0 0 0 2px #ff35d11a}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;border-bottom:1px solid #241534;padding:10px}.platform{display:flex;justify-content:space-between;align-items:center}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:#555}.dot.on{background:var(--good);box-shadow:0 0 10px var(--good)}.hero{padding:22px;border-radius:18px;border:1px solid #4a235e;background:radial-gradient(circle at 100% 0,#ff35d11e,transparent 35%),linear-gradient(135deg,#180a29,#0b0612)}.alert-preview{min-height:260px;display:grid;place-items:center;border:1px dashed #4b2a62;border-radius:14px;background:repeating-conic-gradient(#0f0818 0 25%,#0b0612 0 50%) 50%/22px 22px}.preview-alert{padding:18px 24px;border-radius:18px;background:#0b0711ee;border:1px solid #ff35d177;box-shadow:0 0 35px #ff35d155;text-align:center;animation:pulse 2s infinite}.preview-alert strong{font-size:25px;display:block}.preview-alert span{color:#ddd}@keyframes pulse{50%{transform:scale(1.025)}}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login .box{width:min(440px,100%)}.logo-big{font-size:42px;font-weight:1000}.logo-big b{color:var(--pink)}.hidden{display:none!important}.toast{position:fixed;right:18px;bottom:18px;padding:12px 15px;border:1px solid #63337d;background:#140a20;box-shadow:0 10px 40px #0009;border-radius:12px;z-index:99}.overlay{width:100vw;height:100vh;overflow:hidden;background:transparent;position:relative}.ov{position:absolute;transform:translate(-50%,-50%);min-width:280px;max-width:850px;text-align:center;color:#fff;text-shadow:0 2px 12px #000}.ov .box{padding:22px 30px;border:2px solid #ff35d1;background:linear-gradient(135deg,#140820e8,#09040fe8);border-radius:22px;box-shadow:0 0 55px #ff35d166}.ov h2{margin:0 0 7px;font-size:48px}.ov p{margin:0;font-size:24px}.ov .amount{color:#ff7be1;font-weight:900}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:90;padding:20px}.modalbox{width:min(900px,100%);max-height:90vh;overflow:auto;background:#10071a;border:1px solid #4a245d;border-radius:18px;padding:18px}.range{display:grid;grid-template-columns:1fr 90px;gap:8px}.small{font-size:12px}.kpi{font-size:12px;color:#ad9abf;text-transform:uppercase;letter-spacing:.08em}.feature-list{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.feature{padding:10px;border:1px solid #2b193e;border-radius:10px;background:#0c0612}.toast{animation:in .2s}@keyframes in{from{transform:translateY(10px);opacity:0}}

</style></head><body><div id="root"></div><script>const API='/api';let token=localStorage.getItem('mw_token');let user=JSON.parse(localStorage.getItem('mw_user')||'null');
async function api(path,opt={}){opt.headers={...(opt.headers||{}),...(token?{Authorization:'Bearer '+token}:{})};if(opt.body&&typeof opt.body!=='string'){opt.headers['content-type']='application/json';opt.body=JSON.stringify(opt.body)}const r=await fetch(API+path,opt);const d=await r.json().catch(()=>({}));if(r.status===401){localStorage.clear();location.hash='#login';throw Error('AUTH')}if(!r.ok)throw Error(d.error||'Error');return d}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const state={section:'overview',dash:null,settings:null,timer:null,selectedAlert:null};
const platformInfo={twitch:{name:'Twitch',events:['follow','sub','bits','raid','chat'],icon:'◉',color:'#9146ff'},youtube:{name:'YouTube',events:['follow','sub','member','donation','chat'],icon:'▶',color:'#ff0033'},kick:{name:'Kick',events:['follow','sub','donation','chat'],icon:'K',color:'#53ff88'},tiktok:{name:'TikTok LIVE',events:['follow','sub','gift','share','like','chat'],icon:'♪',color:'#fff'}};
function toast(msg){const e=document.createElement('div');e.className='toast';e.textContent=msg;document.body.appendChild(e);setTimeout(()=>e.remove(),2400)}
function nav(){return `<aside class="side"><div class="brand">✦ <b>MONA</b>WORLD</div><div class="user"><div>NYX SAKURA</div><div class="muted small">${esc(user?.username||'')} · ${esc(user?.role||'')}</div><div class="row" style="margin-top:8px"><span class="dot on"></span><span class="small good">Cloud online</span></div></div><div class="nav">${[['overview','⌂ Overview'],['overlay','✦ Overlay Studio'],['alerts','◆ Alertas'],['events','⚡ Eventos & Actions'],['commands','⌘ Commands'],['music','♫ Music'],['stickers','✦ Stickers'],['rewards','◎ Rewards & UC'],['timer','⏱ MonaTimer'],['platforms','◉ Platforms'],['analytics','◌ Analytics'],['obs','◈ OBS Plugin'],['multichat','☷ Multi Chat'],['media','▶ Media Request'],['settings','⚙ Settings']].map(x=>`<button class="${state.section===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}</div><button class="btn" style="width:100%;margin-top:18px" onclick="logout()">Cerrar sesión</button></aside>`}
function layout(content){return `<div class="app">${nav()}<main class="main">${content}</main></div>`}
async function load(){try{state.dash=await api('/dashboard');state.settings=(await api('/settings')).settings;state.timer=(await api('/timer')).timer;render()}catch(e){if(e.message==='AUTH')render();else toast(e.message)}}
function render(){if(!token){root.innerHTML=`<div class="landing"><section class="landingHero"><div class="landingNav"><div class="brand">✦ <b>MONA</b>WORLD</div><span class="pill">UNIFIED CREATOR OS</span></div><div class="landingGrid"><div><div class="eyebrow">TWITCH · YOUTUBE · KICK · TIKTOK LIVE</div><h1>Todo tu stream.<br><span>Un solo universo.</span></h1><p class="lead">MonaWorld reúne alertas, eventos, MonaCoins, MonaPoints, sonidos, stickers, TTS, comandos, música y overlays en una sola plataforma web conectada a OBS.</p><div class="row"><a class="btn primary big" href="#login">Entrar al Dashboard</a><a class="btn big" href="#donate">Apoyar MonaWorld</a></div><div class="feature-list landingFeatures"><div class="feature">✦ Alertas editables</div><div class="feature">◉ 4 plataformas</div><div class="feature">💎 MonaCoins</div><div class="feature">✦ MonaPoints</div><div class="feature">⏱ MonaTimer</div><div class="feature">♫ TTS + música</div></div></div><div class="loginCard" id="login"><div class="logo-big">✦ <b>MONA</b>WORLD</div><h2>Acceso al Creator Center</h2><p class="muted">Inicia sesión para configurar tu canal, overlays y automatizaciones.</p><div class="field"><label>Usuario</label><input id="loginUser" value="lamonachinajuega"></div><div class="field"><label>Contraseña</label><input id="loginPass" type="password" placeholder="••••••••"></div><button class="btn primary" style="width:100%" onclick="login()">Entrar al Dashboard →</button><p class="muted small">Acceso protegido. Las cuentas demo deben cambiar sus contraseñas antes de producción.</p></div></div></section><section class="landingSection"><div class="sectionTitle"><div class="kpi">POR QUÉ MONAWORLD</div><h2>Unifica la experiencia del streamer</h2></div><div class="grid g3"><div class="card"><h3>⚡ Event Engine</h3><p class="muted">Normaliza follows, subs, members, Bits, gifts, donaciones, likes, shares y comandos.</p></div><div class="card"><h3>🎨 Alert Studio</h3><p class="muted">Diseña alertas con fuentes, colores, imágenes, vídeo, sonidos, TTS, animaciones y reglas por plataforma.</p></div><div class="card"><h3>🖥 OBS por URL</h3><p class="muted">Una Browser Source puede mostrar el overlay completo, reduciendo la cantidad de fuentes que necesita OBS.</p></div></div></section><section class="landingSection" id="donate"><div class="grid g2"><div class="card donationCard"><div class="kpi">APOYA EL PROYECTO</div><h2>💗 Donaciones</h2><p class="muted">Las donaciones para MonaWorld se dirigirán a la cuenta de PayPal de <b>lamonachinajuega@gmail.com</b>.</p><div class="field"><label>Monto sugerido</label><select id="donationAmount"><option value="5">$5 USD</option><option value="10">$10 USD</option><option value="20">$20 USD</option><option value="50">$50 USD</option><option value="100">$100 USD</option></select></div><button class="btn primary" onclick="donatePayPal()">Donar con PayPal →</button><p class="muted small">Antes de producción, sustituye el destino por el enlace oficial de donación/checkout generado en PayPal.</p></div><div class="card"><div class="kpi">PRODUCTOS</div><h2>Productos de Mona</h2><div class="productMini"><div><b>MonaProyect</b><span class="muted small">Proyecto / producto digital</span></div><button class="btn" onclick="productInfo('MonaProyect')">Ver</button></div><div class="productMini"><div><b>MonaClips</b><span class="muted small">Clips y herramientas para creadores</span></div><button class="btn" onclick="productInfo('MonaClips')">Ver</button></div></div></div></section><section class="landingSection"><div class="card premium"><div><div class="kpi">MONAWORLD PREMIUM</div><h2>✦ MonaWorld Pro</h2><p class="muted">Suscripción premium para desbloquear funciones avanzadas, mayores límites y herramientas exclusivas.</p><div class="feature-list"><div class="feature">Alertas avanzadas</div><div class="feature">Más overlays</div><div class="feature">Automatizaciones ampliadas</div><div class="feature">Analíticas avanzadas</div><div class="feature">Biblioteca multimedia</div><div class="feature">Soporte prioritario</div></div></div><div class="premiumPrice"><div class="muted small">PLAN MENSUAL</div><strong>$4.99</strong><span>USD / mes</span><button class="btn primary" onclick="premiumInfo()">Ver Premium →</button></div></div></section><footer class="landingFooter">MonaWorld · Proyecto independiente · © 2026</footer></div>`;return}root.innerHTML=layout(section());}
function section(){const titles={overview:['Control Center ✦','Todo tu stream multicanal, en un solo lugar.'],overlay:['Overlay Studio','Un canvas único para OBS con fuentes, capas y reglas.'],alerts:['Alertas','Editor visual por evento y plataforma.'],events:['Eventos & Actions','Triggers, condiciones, acciones y simulación.'],commands:['Commands','Comandos multicanal y permisos.'],music:['Music','Solicitudes, cola y reglas de música.'],stickers:['Stickers','Stickers, sonidos y recompensas visuales.'],rewards:['Rewards & UC','MonaCoins, puntos de fidelidad y tienda.'],platforms:['Platforms','Conecta y normaliza Twitch, YouTube, Kick y TikTok LIVE.'],analytics:['Analytics','Actividad y métricas unificadas.'],settings:['Settings','Cuenta, economía y moderación.'],timer:['MonaTimer','Contador extensible por MonaCoins y configurable para el overlay.'],obs:['OBS Plugin','Integración con OBS para chat, eventos y media request.'],multichat:['Multi Chat','Chat unificado de Twitch, YouTube, Kick y TikTok LIVE.'],media:['Media Request','Solicitudes multimedia con cola, moderación, límites y permisos.']};const t=titles[state.section];return `<div class="top"><div><div class="kpi">Workspace / ${t[0]}</div><h1>${t[0]}</h1><div class="muted">${t[1]}</div></div><div class="row"><span class="pill">LIVE READY</span><button class="btn primary" onclick="testEvent()">⚡ Test Event</button></div></div>${window[state.section+'View']?window[state.section+'View']():overviewView()}`}
function overviewView(){const e=state.dash?.events||[];return `<div class="hero"><div class="row" style="justify-content:space-between"><div><h2 style="margin:0">Unifica las 4 plataformas</h2><p class="muted">Una sola economía, un solo Alert Engine y un solo Browser Source.</p></div><button class="btn" onclick="go('overlay')">Abrir Overlay Studio →</button></div></div><div class="grid g4" style="margin-top:14px">${[['Eventos','1,284','+18.4%'],['Seguidores','428','+32 hoy'],['Subs / Members','73','+9 hoy'],['MonaCoins','12,450','+21%']].map(x=>`<div class="card stat"><div class="kpi">${x[0]}</div><div class="num">${x[1]}</div><div class="good small">${x[2]}</div></div>`).join('')}</div><div class="grid g2" style="margin-top:14px"><div class="card"><h3>Tu ecosistema</h3>${Object.keys(platformInfo).map(p=>{const row=(state.dash.platforms||[]).find(x=>x.platform===p);return `<div class="platform" style="padding:10px 0;border-bottom:1px solid #251536"><span>${platformInfo[p].icon} <b>${platformInfo[p].name}</b><br><span class="muted small">${row?.connected?'Connected':'Demo / no conectado'}</span></span><span class="dot ${row?.connected?'on':''}"></span></div>`}).join('')}</div><div class="card"><h3>⏱ MonaTimer</h3><p class="muted">Contador que puede extenderse automáticamente cuando una donación/apoyo genera MonaCoins.</p><button class="btn primary" onclick="go('timer')">Configurar contador →</button></div><div class="card"><h3>Actividad reciente</h3>${e.slice(0,7).map(ev=>`<div style="padding:9px 0;border-bottom:1px solid #251536"><b>${esc(ev.user_name)}</b> · ${esc(ev.event_type)} · <span class="accent">${ev.amount||''} ${esc(ev.unit)}</span><div class="muted small">${esc(ev.platform)} · ${new Date(ev.created_at).toLocaleString()}</div></div>`).join('')||'<div class="muted">Sin eventos todavía.</div>'}</div></div><div class="card" style="margin-top:14px"><h3>Acciones rápidas</h3><div class="feature-list"><div class="feature"><b>Editar overlay</b><div class="muted small">Mueve y organiza tu canvas</div></div><div class="feature"><b>Configurar alertas</b><div class="muted small">Diseña animaciones y sonidos</div></div><div class="feature"><b>Crear automatización</b><div class="muted small">Evento → condición → acción</div></div></div></div>`}
window.overviewView=overviewView;

window.mediaView=()=>`<div class="hero"><div class="kpi">MEDIA REQUEST</div><h2>▶ Solicitudes multimedia</h2><p class="muted">Cola de vídeos/música solicitados por la audiencia, con aprobación de moderadores y límites configurables.</p></div><div class="grid g2" style="margin-top:14px"><div class="card"><h3>Agregar solicitud</h3><div class="field"><label>URL</label><input id="mrurl" placeholder="https://..." /></div><div class="field"><label>Solicitado por</label><input id="mruser" value="ViewerDemo" /></div><div class="field"><label>Costo en MonaPoints</label><input id="mrcost" type="number" value="500" /></div><div class="row"><button class="btn primary" onclick="addMediaDemo()">Añadir a cola</button><button class="btn" onclick="toast('La reproducción se conectará al plugin/OBS')">Probar reproducción</button></div></div><div class="card"><h3>Reglas</h3><div class="field"><label>Límite por usuario</label><input type="number" value="3"></div><div class="field"><label>Duración máxima (min)</label><input type="number" value="10"></div><div class="field"><label>Requiere aprobación</label><select><option>Sí</option><option>No</option></select></div><div class="field"><label>Fuentes permitidas</label><input value="YouTube, enlaces directos"></div><button class="btn" onclick="toast('Reglas guardadas en demo')">Guardar reglas</button></div></div><div class="card" style="margin-top:14px"><h3>Cola</h3><div id="mediaQueue" class="mediaQueue"><div class="queueItem"><span>Demo Track — ViewerDemo</span><span class="row"><button class="btn good" onclick="toast('Aprobado')">✓</button><button class="btn danger" onclick="toast('Rechazado')">✕</button></span></div></div></div>`;

window.timerView=()=>{const t=state.timer||{};return `<div class="hero"><div class="row" style="justify-content:space-between"><div><div class="kpi">MONAWORLD FEATURE</div><h2 style="margin:0">⏱ MonaTimer</h2><p class="muted">Un contador para OBS que se puede extender con cada apoyo monetario según los MonaCoins generados.</p></div><div class="pill">${t.enabled?'ACTIVO':'PAUSADO'}</div></div></div><div class="grid g2" style="margin-top:14px"><div class="card"><h3>Configuración</h3><div class="field"><label>Nombre</label><input id="tmname" value="${esc(t.name||'MonaTimer')}"></div><div class="field"><label>Segundos iniciales</label><input id="tminitial" type="number" min=0 value="${Number(t.initial_seconds||600)}"></div><div class="field"><label>Máximo de segundos</label><input id="tmmax" type="number" min=1 value="${Number(t.max_seconds||3600)}"></div><div class="field"><label>Segundos por MonaCoin</label><input id="tmrate" type="number" min=0 step=0.01 value="${Number(t.seconds_per_monacoin??0.1)}"></div><div class="row"><label><input id="tmenabled" type="checkbox" ${t.enabled?'checked':''}> Activo</label><label><input id="tmstart" type="checkbox" ${t.auto_start?'checked':''}> Iniciar automáticamente</label></div><button class="btn primary" style="margin-top:12px" onclick="saveTimer()">Guardar contador</button></div><div class="card"><h3>Extensión por apoyo</h3><p class="muted">La extensión usa los MonaCoins normalizados por MonaWorld. Ejemplo: si configuras 0,1 s por MonaCoin, 1.000 MonaCoins agregan 100 segundos.</p><div class="field"><label>Etiqueta</label><input id="tmlabel" value="${esc(t.label||'MonaTimer')}"></div><div class="grid g2"><div class="field"><label>X %</label><input id="tmx" type="number" value="${Number(t.position_x??50)}"></div><div class="field"><label>Y %</label><input id="tmy" type="number" value="${Number(t.position_y??15)}"></div></div><div class="field"><label>Fuente</label><select id="tmfont">${['Inter','Arial','Verdana','Georgia','Courier New'].map(x=>`<option ${x===(t.font_family||'Inter')?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Tamaño</label><input id="tmfs" type="number" value="${Number(t.font_size||56)}"></div><div class="field"><label>Color texto</label><input id="tmtc" type="color" value="${t.text_color||'#ffffff'}"></div><div class="field"><label>Color neon</label><input id="tmac" type="color" value="${t.accent_color||'#ff35d1'}"></div></div></div><div class="card" style="margin-top:14px"><h3>Pruebas</h3><p>Tiempo actual: <b id="tmcurrent">${formatTimer(t.end_at)}</b></p><div class="row"><button class="btn primary" onclick="timerStart()">▶ Iniciar</button><button class="btn" onclick="timerAdd(60)">+60 s</button><button class="btn" onclick="timerAdd(300)">+5 min</button><button class="btn danger" onclick="timerReset()">↺ Reiniciar</button></div><p class="muted small" style="margin-top:10px">También puedes usar “Test Event” con una donación/Bits/Gift: el prototipo calculará los MonaCoins y extenderá el contador.</p></div>`};
window.settingsView=()=>`<div class="grid g2"><div class="card"><h3>Cuenta</h3><p><b>${esc(user.username)}</b> · ${esc(user.role)}</p><p class="muted">Sesión protegida por token. No guardamos contraseñas en el navegador.</p><button class="btn danger" onclick="logout()">Cerrar sesión</button></div><div class="card"><h3>Moderación</h3><div class="field"><label>Modo</label><select id="mod"><option>balanced</option><option>strict</option><option>off</option></select></div><div class="field"><label>Lectura TTS</label><select id="tts"><option value="1">Activada</option><option value="0">Desactivada</option></select></div><button class="btn primary" onclick="saveSettings()">Guardar</button></div></div>`;
function simpleFeature(title,desc,items){return `<div class="card"><h3>${title}</h3><p class="muted">${desc}</p><div class="feature-list">${items.map(x=>`<div class="feature">✦ ${x}</div>`).join('')}</div><div class="row" style="margin-top:15px"><button class="btn primary" onclick="toast('Módulo preparado para probar')">Probar módulo</button><button class="btn" onclick="toast('Configuración guardada')">Guardar</button></div></div>`}
function go(s){state.section=s;render();}
async function login(){try{const d=await api('/auth/login',{method:'POST',body:{username:loginUser.value,password:loginPass.value}});token=d.token;user=d.user;localStorage.setItem('mw_token',token);localStorage.setItem('mw_user',JSON.stringify(user));load()}catch(e){toast(e.message)}}
async function logout(){await api('/auth/logout',{method:'POST'}).catch(()=>{});localStorage.clear();token=null;user=null;render()}

async function simulate(p,ev){await api('/events/test',{method:'POST',body:{platform:p,event_type:ev,user_name:'ViewerDemo',amount:ev==='bits'?500:ev==='gift'?99:ev==='donation'?5:0,unit:ev==='bits'?'Bits':ev==='gift'?'Coins':'USD',message:'¡Hola Mona!'}});toast('Evento '+ev+' enviado');load()}
async function testEvent(){await simulate('twitch','bits')}
async function saveSettings(){const b={loyalty_name:document.getElementById('lname')?.value||state.settings?.loyalty_name||'MonaPoints',monacoins_per_unit:Number(document.getElementById('uc')?.value||state.settings?.monacoins_per_unit||100),tts_enabled:Number(document.getElementById('tts')?.value||1),moderation_mode:document.getElementById('mod')?.value||'balanced'};await api('/settings',{method:'PUT',body:b});toast('Configuración guardada');load()}
async function addReward(){const name=prompt('Nombre de la recompensa','Explosión Neon');if(!name)return;const cost=Number(prompt('Costo en puntos','100')||100);await api('/rewards',{method:'POST',body:{name,cost,type:'sound'}});toast('Recompensa creada');load()}

async function editAlert(id){const a=state.dash.alerts.find(x=>x.id===id);const modal=document.createElement('div');modal.className='modal';modal.innerHTML=`<div class="modalbox"><div class="top"><h2>Editar ${esc(a.name)}</h2><button class="btn" onclick="this.closest('.modal').remove()">Cerrar</button></div><div class="grid g2"><div><div class="field"><label>Nombre</label><input id="an" value="${esc(a.name)}"></div><div class="field"><label>Plataforma</label><select id="ap">${['all','twitch','youtube','kick','tiktok'].map(x=>`<option ${x===a.platform?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Texto / variables</label><textarea id="at" rows="4">${esc(a.template)}</textarea></div><div class="field"><label>URL imagen/GIF/vídeo</label><input id="am" value="${esc(a.media_url||'')}"></div><div class="field"><label>URL sonido</label><input id="as" value="${esc(a.sound_url||'')}"></div></div><div><div class="field"><label>Fuente</label><select id="af"><option>Inter</option><option>Arial</option><option>Verdana</option><option>Georgia</option><option>Courier New</option></select></div><div class="field"><label>Tamaño</label><input id="afs" type="number" value="${a.font_size}"></div><div class="field"><label>Color</label><input id="ac" type="color" value="${a.text_color}"></div><div class="field"><label>Color neon</label><input id="aa" type="color" value="${a.accent_color}"></div><div class="field"><label>Animación</label><select id="ax"><option>pop</option><option>slide</option><option>zoom</option><option>shake</option><option>fade</option></select></div><div class="row"><label><input id="attts" type="checkbox" ${a.tts?'checked':''}> TTS</label><label><input id="ae" type="checkbox" ${a.enabled?'checked':''}> Activa</label></div></div></div><hr style="border-color:#251536"><div class="row"><button class="btn primary" onclick="saveAlert(${id},this)">Guardar cambios</button><button class="btn" onclick="previewAlert(${id})">Preview</button></div></div>`;document.body.appendChild(modal)}
async function saveAlert(id,btn){const a=state.dash.alerts.find(x=>x.id===id);await api('/alerts',{method:'POST',body:{...a,id,name:an.value,platform:ap.value,template:at.value,media_url:am.value,sound_url:as.value,font_family:af.value,font_size:Number(afs.value),text_color:ac.value,accent_color:aa.value,animation:ax.value,tts:attts.checked,enabled:ae.checked}});btn.closest('.modal').remove();toast('Alerta guardada');load()}
function previewAlert(id){window.open('/overlay?user='+encodeURIComponent(user.username)+'&preview='+id,'_blank')}
function copyOverlay(){navigator.clipboard.writeText(location.origin+'/overlay?user='+encodeURIComponent(user.username));toast('URL del overlay copiada')}
function formatTimer(end){const sec=Math.max(0,Math.ceil((Number(end||0)-Date.now())/1000));const m=Math.floor(sec/60),s=sec%60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
async function saveTimer(){const b={name:tmname.value,initial_seconds:Number(tminitial.value||600),max_seconds:Number(tmmax.value||3600),seconds_per_monacoin:Number(tmrate.value||0),enabled:tmenabled.checked,auto_start:tmstart.checked,label:tmlabel.value,position_x:Number(tmx.value||50),position_y:Number(tmy.value||15),font_family:tmfont.value,font_size:Number(tmfs.value||56),text_color:tmtc.value,accent_color:tmac.value};await api('/timer',{method:'PUT',body:b});toast('MonaTimer guardado');load()}
async function timerStart(){await api('/timer/start',{method:'POST'});toast('MonaTimer iniciado');load()}
async function timerAdd(seconds){await api('/timer/add',{method:'POST',body:{seconds}});toast('Tiempo añadido');load()}
async function timerReset(){await api('/timer/reset',{method:'POST'});toast('MonaTimer reiniciado');load()}
function copyOverlay(){navigator.clipboard?.writeText(location.origin+'/overlay?user=lamonachinajuega');toast('URL de OBS copiada')}
function addMediaDemo(){const q=document.getElementById('mediaQueue');const u=document.getElementById('mrurl').value||'https://demo.invalid/media';const who=document.getElementById('mruser').value||'ViewerDemo';q.insertAdjacentHTML('beforeend',`<div class="queueItem"><span>${esc(u)} — ${esc(who)}</span><span class="row"><button class="btn good" onclick="toast('Aprobado')">✓</button><button class="btn danger" onclick="this.closest('.queueItem').remove()">✕</button></span></div>`);toast('Solicitud añadida a la cola demo')}
async function donatePayPal(){const amount=document.getElementById('donationAmount')?.value||'';const url='https://www.paypal.com/myaccount/transfer/send';toast('Abriendo PayPal para enviar la donación a lamonachinajuega@gmail.com'+(amount?' · '+amount+' USD':''));window.open(url,'_blank');}function premiumInfo(){toast('Premium preparado: falta conectar el checkout y webhook de pago.');go('store')}function productInfo(name){toast(name+' seleccionado. Configura su checkout cuando definamos la tienda.');go('store')}
