<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VTuber Unified Overlay</title><link rel="stylesheet" href="styles.css"></head><body style="background:transparent;overflow:hidden"><div id="canvas" class="canvas" style="width:100vw;height:100vh;border:0;border-radius:0;background:transparent"></div><script>const saved=localStorage.getItem('vu_layout_neon');document.getElementById('canvas').innerHTML=saved||'<div class="el alert-el" style="left:40%;top:11%">✦ ALERTA ✦<small>Esperando eventos...</small></div>';<\/script><script>const p=location.protocol==='https:'?'wss':'ws';const w=new WebSocket(p+'://'+location.host+'/ws?user=demo');w.onmessage=e=>{try{const x=JSON.parse(e.data).event;const a=document.querySelector('.alert');const t=document.getElementById('alert-text')||a;if(t)t.textContent=(x.actor?.name||'Viewer')+' · '+(x.value?.uc||x.type);if(a)a.animate([{transform:'scale(.9)',opacity:.2},{transform:'scale(1)',opacity:1}],{duration:500})}catch{}}</script></body></html>
