<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MonaWorld Overlay</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Inter,system-ui,sans-serif;color:#fff}.stage{position:relative;width:100vw;height:100vh}.box{position:absolute;border:1px solid #ff62bb;background:#110a18dc;box-shadow:0 0 35px #ff45b74d;border-radius:14px}.alert{left:39%;top:9%;width:22%;padding:1.2%;text-align:center}.alert b{color:#ff78c7;font-size:1.2vw}.alert small{display:block;margin-top:.4vw;color:#cdbccc;font-size:.75vw}.chat{left:3%;bottom:6%;width:20%;padding:1%;font-size:.8vw}.chat>b{color:#ff74c3}.chat p{color:#c4b6c7}.goal{right:3%;bottom:12%;width:17%;padding:.9%;text-align:center;font-size:.8vw}.music{left:41%;bottom:3%;width:19%;padding:.6%;text-align:center;font-size:.7vw;color:#c8b9d0}
</style></head><body><div class="stage"><div class="box alert"><b>✦ ALERTA ✦</b><small id="alert-text">Esperando eventos...</small></div><div class="box chat"><b>CHAT</b><p>Nyx, esa jugada 😭</p><p>Frank: LET'S GOOO</p><p>Luna: 💜💜💜</p></div><div class="box goal">META · <b>72%</b></div><div class="box music">♫ NOW PLAYING · Night Drive</div></div><script>
const p=location.protocol==="https:"?"wss":"ws";const ws=new WebSocket(`${p}://${location.host}/ws?user=demo`);ws.onmessage=e=>{try{const x=JSON.parse(e.data);if(x.kind==="event"){const v=x.event;document.getElementById("alert-text").textContent=`${v.actor?.name||"Viewer"} · ${v.value?.uc||0} UC`;setTimeout(()=>document.getElementById("alert-text").textContent="Esperando eventos...",5000)}}catch{}}; 
</script></body></html>
