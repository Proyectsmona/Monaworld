<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MonaWorld Overlay</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}body{font-family:Inter,system-ui,sans-serif}.ov{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);min-width:360px;max-width:900px;text-align:center;color:white}.box{padding:24px 34px;border:2px solid #ff35d1;border-radius:22px;background:linear-gradient(135deg,#140820f0,#08040df0);box-shadow:0 0 60px #ff35d177, inset 0 0 30px #8b5cf622;animation:pop .45s}.box h1{margin:0 0 8px;font-size:46px;text-shadow:0 0 20px #ff35d1}.box p{margin:0;font-size:24px}.amount{color:#ff75df;font-weight:900}@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}.idle{opacity:.8;font-size:20px}.timer{position:absolute;left:50%;top:15%;transform:translate(-50%,-50%);min-width:260px;padding:10px 22px;text-align:center;color:#fff;border:2px solid #ff35d1;border-radius:18px;background:#09040de8;box-shadow:0 0 35px #ff35d155;font-weight:900;font-size:56px;text-shadow:0 0 18px #ff35d1}.timer .label{display:block;font-size:14px;letter-spacing:.16em;color:#ff75df;margin-bottom:2px;text-transform:uppercase}</style></head><body><div id="timer" class="timer"></div><div id="stage"></div><script>const p=new URLSearchParams(location.search),username=p.get('user')||'lamonachinajuega';let last=0;let timerCfg=null;async function pollTimer(){try{const r=await fetch('/api/timer?user='+encodeURIComponent(username));const d=await r.json();timerCfg=d.timer;drawTimer()}catch{}setTimeout(pollTimer,1000)}function drawTimer(){const e=document.getElementById('timer');if(!timerCfg||!timerCfg.enabled){e.style.display='none';return}const sec=Math.max(0,Math.ceil((Number(timerCfg.end_at||0)-Date.now())/1000));const m=Math.floor(sec/60),s=sec%60;e.style.display='block';e.style.left=(timerCfg.position_x??50)+'%';e.style.top=(timerCfg.position_y??15)+'%';e.style.fontFamily=timerCfg.font_family||'Inter';e.style.fontSize=(timerCfg.font_size||56)+'px';e.style.color=timerCfg.text_color||'#fff';e.style.borderColor=timerCfg.accent_color||'#ff35d1';e.innerHTML=(timerCfg.show_label?'<span class="label">'+safe(timerCfg.label||'MonaTimer')+'</span>':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}async function poll(){try{const r=await fetch('/api/overlay/events?since='+last+'&user='+encodeURIComponent(username));const d=await r.json();for(const e of d.events||[]){last=e.id;show(e)}}catch{}setTimeout(poll,900)}function show(e){const st=document.getElementById('stage');const x=document.createElement('div');x.className='ov';const label=e.event_type==='bits'?'BITS':e.event_type==='gift'?'GIFT':e.event_type==='donation'?'DONACIÓN':e.event_type.toUpperCase();x.innerHTML='<div class="box"><h1>✦ '+label+'</h1><p><b>'+safe(e.user_name)+'</b> <span class="amount">'+(e.amount||'')+' '+safe(e.unit||'')+'</span></p><p>'+safe(e.message||'')+'</p></div>';st.innerHTML='';st.appendChild(x);setTimeout(()=>x.remove(),6500)}function safe(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}poll();pollTimer();</script></body></html>
