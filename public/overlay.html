<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MonaWorld Overlay</title><link rel="stylesheet" href="/overlay.css"></head><body><div class="stage"><div class="alert box"><b>✦ ALERTA ✦</b><small id="alert-text">Esperando eventos...</small></div><div class="chat box"><b>CHAT</b><p>Nyx, esa jugada 😭</p><p>Frank: LET'S GOOO</p><p>Luna: 💜💜💜</p></div><div class="goal box">META · <b>72%</b></div><div class="music box">♫ NOW PLAYING · Night Drive</div></div><script>const p=location.protocol==='https:'?'wss':'ws';const ws=new WebSocket(`${p}://${location.host}/ws?user=demo`);ws.onmessage=e=>{try{const x=JSON.parse(e.data);if(x.kind==='event'){const v=x.event;document.getElementById('alert-text').textContent=(v.actor?.name||'Viewer')+' · '+(v.value?.uc||0)+' UC';setTimeout(()=>document.getElementById('alert-text').textContent='Esperando eventos...',5000)}}catch{}}</script></body></html>
